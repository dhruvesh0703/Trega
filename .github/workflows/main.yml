name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm ci
          npm rebuild esbuild rollup
      - name: Build web app
        run: npm run build
      - name: Generate Clean iOS Project
        run: |
          npm install @capacitor/ios @capacitor/cli @capacitor/core
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          cp GoogleService-Info.plist ios/App/App/
          
          # Inject Firebase configuration safely using Node.js
          node -e "
          const fs = require('fs');
          const path = './ios/App/App/AppDelegate.swift';
          let content = fs.readFileSync(path, 'utf8');
          if (!content.includes('import FirebaseCore')) {
            content = content.replace('import UIKit', 'import UIKit\nimport FirebaseCore');
          }
          if (!content.includes('FirebaseApp.configure()')) {
            content = content.replace(
              /func application\(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: \[UIApplication\.LaunchOptionsKey: Any\]\?\) -> Bool \{/,
              'func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {\n        FirebaseApp.configure()'
            );
          }
          fs.writeFileSync(path, content);
          console.log('Successfully patched AppDelegate.swift');
          "
      - name: Install Cocoapods
        run: |
          cd ios/App
          pod install
      - name: Build IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath $PWD/build/App.xcarchive -exportOptionsPlist App/exportOptions.plist -exportPath $PWD/build/ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app.ipa
          path: ios/App/build/ipa/App.ipa