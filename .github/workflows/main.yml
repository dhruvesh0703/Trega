name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          rm -rf package-lock.json node_modules
          npm install
          
      - name: Build web app
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build
        
      - name: Generate Clean iOS Project
        run: |
          npm install @capacitor/ios @capacitor/cli @capacitor/core
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # Auto-Generate GoogleService-Info.plist for iOS Firebase Native Auth
          cat << 'EOF' > ios/App/App/GoogleService-Info.plist
          
          <?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>CLIENT_ID</key>
	<string>381942828602-o8a05n8jvl83gj9ebig797agf54b7lla.apps.googleusercontent.com</string>
	<key>REVERSED_CLIENT_ID</key>
	<string>com.googleusercontent.apps.381942828602-o8a05n8jvl83gj9ebig797agf54b7lla</string>
	<key>ANDROID_CLIENT_ID</key>
	<string>381942828602-raivhltj0pg6h8joradfdb955895p040.apps.googleusercontent.com</string>
	<key>API_KEY</key>
	<string>AIzaSyD7IklaIQhgpQrdaoGC4IMGjo-nKRh7XBU</string>
	<key>GCM_SENDER_ID</key>
	<string>381942828602</string>
	<key>PLIST_VERSION</key>
	<string>1</string>
	<key>BUNDLE_ID</key>
	<string>in.trega.app</string>
	<key>PROJECT_ID</key>
	<string>lithe-disk-8gbcx</string>
	<key>STORAGE_BUCKET</key>
	<string>lithe-disk-8gbcx.firebasestorage.app</string>
	<key>IS_ADS_ENABLED</key>
	<false></false>
	<key>IS_ANALYTICS_ENABLED</key>
	<false></false>
	<key>IS_APPINVITE_ENABLED</key>
	<true></true>
	<key>IS_GCM_ENABLED</key>
	<true></true>
	<key>IS_SIGNIN_ENABLED</key>
	<true></true>
	<key>GOOGLE_APP_ID</key>
	<string>1:381942828602:ios:5853360712a299e88faf03</string>
</dict>
</plist>
          
          EOF
          
          # Link plist in Xcode using xcodeproj gem so Firebase doesn't crash
          sudo gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app_group = project.main_group.find_subpath(File.join('App'), true)
          unless app_group.files.any? { |f| f.path == 'GoogleService-Info.plist' }
            file_ref = app_group.new_reference('GoogleService-Info.plist')
            target = project.targets.first
            target.resources_build_phase.add_file_reference(file_ref, true)
            project.save
            puts 'Successfully linked GoogleService-Info.plist to Xcode project'
          end
          "
          
          # Inject REVERSED_CLIENT_ID into Info.plist for Phone Auth
          python3 -c "
          import re, os
          gs_path = './ios/App/App/GoogleService-Info.plist'
          info_path = './ios/App/App/Info.plist'
          if os.path.exists(gs_path) and os.path.exists(info_path):
              with open(gs_path, 'r') as f:
                  gs_content = f.read()
              match = re.search(r'<key>REVERSED_CLIENT_ID</key>\s*<string>(.*?)</string>', gs_content)
              if match:
                  rev_id = match.group(1)
                  with open(info_path, 'r') as f:
                      info_content = f.read()
                  if 'CFBundleURLTypes' not in info_content:
                      url_types = (
                          '\t<key>CFBundleURLTypes</key>\n'
                          '\t<array>\n'
                          '\t\t<dict>\n'
                          '\t\t\t<key>CFBundleTypeRole</key>\n'
                          '\t\t\t<string>Editor</string>\n'
                          '\t\t\t<key>CFBundleURLSchemes</key>\n'
                          '\t\t\t<array>\n'
                          '\t\t\t\t<string>' + rev_id + '</string>\n'
                          '\t\t\t</array>\n'
                          '\t\t</dict>\n'
                          '\t</array>'
                      )
                      info_content = info_content.replace('</dict>\n</plist>', url_types + '\n</dict>\n</plist>')
                      with open(info_path, 'w') as f:
                          f.write(info_content)
                      print('Successfully injected REVERSED_CLIENT_ID into Info.plist')
          "
          
          # Inject Firebase configuration safely using Node.js
          node -e "
          const fs = require('fs');
          const path = './ios/App/App/AppDelegate.swift';
          let content = fs.readFileSync(path, 'utf8');
          if (!content.includes('import FirebaseCore')) {
            content = content.replace('import UIKit', 'import UIKit\nimport FirebaseCore');
          }
          if (!content.includes('FirebaseApp.configure()')) {
            content = content.replace(
              /func application\(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: \[UIApplication\.LaunchOptionsKey: Any\]\?\) -> Bool \{/,
              'func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {\n        FirebaseApp.configure()'
            );
          }
          fs.writeFileSync(path, content);
          console.log('Successfully patched AppDelegate.swift');
          "
          
      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr app.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app.ipa
          path: ios/App/build/app.ipa